name: Notify Slack on deploy

on:
  push:
    branches: [main]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"🚀 Déploiement *${{ github.repository }}*\n> ${{ github.event.head_commit.message }}\n👤 ${{ github.event.head_commit.author.name }}\"}" \
            ${{ secrets.SLACK_WEBHOOK_URL }}
